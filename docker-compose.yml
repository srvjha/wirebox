name: wirebox

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wirebox
      POSTGRES_PASSWORD: wirebox
      POSTGRES_DB: wirebox
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirebox -d wirebox"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Full stack in containers: `docker compose --profile app up --build`
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://wirebox:wirebox@db:5432/wirebox
    ports:
      - "3000:3000"

volumes:
  pgdata:
