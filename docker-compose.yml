name: wirebox

# Local Postgres and auth come from Supabase (`pnpm db:up`), not from this file.
services:
  # Production build in a container: `docker compose --profile app up --build`.
  # Point .env at a hosted Supabase project first: the container can't reach the
  # local Supabase stack on 127.0.0.1.
  app:
    profiles: ["app"]
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    env_file: .env
    ports:
      - "3000:3000"
